name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: todolist
          POSTGRES_USER: todolist
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U todolist" --health-interval 5s --health-retries 10
    env:
      DJANGO_DB_HOST: ${{ matrix.database == 'postgres' && '127.0.0.1' || '' }}
      DJANGO_DB_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Django checks and tests
        env:
          DJANGO_DEBUG: "true"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test todolist -v 2
      - name: Production settings refuse to start without a secret key
        run: |
          if python manage.py check 2>/dev/null; then echo "started without a secret key"; exit 1; fi
      - name: Image builds
        if: matrix.database == 'sqlite'
        run: docker build -t todolist .
