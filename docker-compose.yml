# Local run: http://localhost:8000/todolist/
services:
  todolist:
    build: .
    image: todolist
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-dev-only-change-me}
      DJANGO_EXTRA_CSRF_ORIGINS: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - todolist-data:/data
volumes:
  todolist-data: {}
